# Netlify: lumtera.mantrabrain.com (site "lumtera") serves these docs at /docs/.

[build]
  command = "npm run build"
  publish = "docs/.vitepress/dist"

[build.environment]
  NODE_VERSION = "20"

# The site is built with base /docs/, but Netlify publishes the build at the
# domain root. Serve /docs/* from the build, and send the bare domain to /docs/.
[[redirects]]
  from = "/docs/*"
  to = "/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/docs/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
